[package]
name = "a3s-apofasi"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["A3S Lab"]
repository = "https://github.com/A3S-Lab/Apofasi"
homepage = "https://github.com/A3S-Lab/Apofasi"
documentation = "https://docs.rs/a3s-apofasi"
readme = "README.md"
description = "Typed System-1 decision engine for A3S hosts"
keywords = ["a3s", "decision", "routing", "calibration", "system-one"]
categories = ["science", "algorithms"]

[features]
default = ["router"]
# Pure routing over script/language detection (no ML framework).
router = []
# Candle neural inference (off by default to keep artifacts small).
infer = ["dep:candle-core", "dep:candle-nn", "dep:tokenizers"]
metal = ["infer", "candle-core/metal", "candle-nn/metal"]
# Apple MLX decision forward (links a prebuilt libmlx; see build.rs).
mlx = ["infer"]
cuda = ["infer", "candle-core/cuda", "candle-nn/cuda"]
# RLCD train helpers + publish layout (pulls infer for checkpoint IO).
train = ["infer"]
# CLI binary `a3s-apofasi` (smoke / bench).
cli = ["infer"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
candle-core = { version = "0.9.1", optional = true }
candle-nn = { version = "0.9.1", optional = true }
tokenizers = { version = "0.21", optional = true }

[build-dependencies]
cc = "1"

[dev-dependencies]

[[bin]]
name = "a3s-apofasi"
path = "src/bin/apofasi.rs"
required-features = ["cli"]

[[example]]
name = "suite"
required-features = ["infer"]

[[example]]
name = "host_gate"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Prefer when packaging size matters more than peak runtime speed.
[profile.release-size]
inherits = "release"
opt-level = "z"
